# Publishes the full app (live DataSF and USGS lookups, city parcel tiles,
# street basemap) to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # felt/tippecanoe main at v2.82.0 (no release tag yet); the same build made the local tiles.
  TIPPECANOE_COMMIT: 4f2621186acfec33b63ddf636f665623c0fef2dd

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Cache tippecanoe
        id: tippecanoe
        uses: actions/cache@v4
        with:
          path: ~/tippecanoe
          key: tippecanoe-${{ runner.os }}-${{ env.TIPPECANOE_COMMIT }}
      - name: Build tippecanoe
        if: steps.tippecanoe.outputs.cache-hit != 'true'
        run: |
          git init -q /tmp/tippecanoe
          git -C /tmp/tippecanoe fetch -q --depth 1 https://github.com/felt/tippecanoe "$TIPPECANOE_COMMIT"
          git -C /tmp/tippecanoe checkout -q FETCH_HEAD
          make -C /tmp/tippecanoe -j"$(nproc)" tippecanoe
          mkdir -p ~/tippecanoe
          cp /tmp/tippecanoe/tippecanoe ~/tippecanoe/

      # Parcels and zoning straight from DataSF, so each deploy carries current data.
      - name: Build the parcel tiles
        run: TIPPECANOE="$HOME/tippecanoe/tippecanoe" pnpm build-tiles
      - name: Build the app
        run: pnpm build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
